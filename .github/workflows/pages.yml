name: Deploy audited browser distribution

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out static distribution
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject anything outside the release allowlist
        run: node .github/scripts/verify-release.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload audited clean artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy audited artifact
        id: deployment
        uses: actions/deploy-pages@v5
